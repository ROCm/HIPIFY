    clang_arguments += " -I'%s'"

# Collect all active root paths in the exact order they are appended to clang_arguments
roots = [
    root for root in [
        config.cuda_sdk_root,
        config.cuda_dnn_root,
        config.cuda_cub_root,
        config.cuda_tensor_root,
        config.cuda_file_root,
        config.cuda_sparselt_root,
    ] if root and root != "OFF"
]

if roots:
    config.substitutions.append(("%clang_args", clang_arguments % tuple(roots)))

if config.llvm_version_major < 4:
    hipify_arguments = "-I'%s'/include"
else:
    hipify_arguments = "\"--cuda-path=%s\""

