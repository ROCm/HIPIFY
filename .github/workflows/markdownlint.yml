name: Markdownlint mdl Action
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Use markdownlint
      uses: actionshub/markdownlint@6a82fb1731c51a2d16dcc05b3c5c24fe733a2244 # v3.1.3
      with:
        filesToIgnoreRegex: "README.md"
